[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
remappings = [
    "@account-abstraction/=node_modules/@account-abstraction/",
    "@openzeppelin/=node_modules/@openzeppelin/"
]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]

[invariant]
runs = 256
depth = 64
fail_on_revert = false
