<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BASTION X — Breach-Resilient Agent Wallet</title>

  <!-- Non-blocking font loading prevents forced layout calculation warnings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  </noscript>

  <script>
    // Suppress benign MetaMask extension EventEmitter & deprecation noise
    (function() {
      try {
        if (window.ethereum && typeof window.ethereum.setMaxListeners === 'function') {
          window.ethereum.setMaxListeners(100);
        }
      } catch (e) {}

      const origWarn = console.warn;
      console.warn = function(...args) {
        const msg = args.map(a => (typeof a === 'string' ? a : (a?.stack || a?.message || ''))).join(' ');
        if (
          msg.includes('MaxListenersExceededWarning') ||
          msg.includes('ObjectMultiplex') ||
          msg.includes('background-liveness') ||
          msg.includes('metamask-multichain-provider') ||
          msg.includes('contentscript.js') ||
          msg.includes('InstallTrigger') ||
          msg.includes('Window.fullScreen') ||
          msg.includes('onmozfullscreen')
        ) {
          return;
        }
        origWarn.apply(console, args);
      };
    })();
  </script>
</head>

<body class="bg-transparent text-white antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
